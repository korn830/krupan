<!DOCTYPE html>
<html lang="th" data-mode="user">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <title>แบบสวิตช์ — หน้าเข้าสู่ระบบเดียว สลับผู้ใช้/เจ้าหน้าที่</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/all.min.css">

    <style>
        /* ====== ธีมของแต่ละโหมด ======
           สลับค่าตัวแปรชุดเดียว หน้าทั้งหน้าก็เปลี่ยนตาม
           ผู้ใช้ทั่วไป = ม่วง เป็นมิตร / เจ้าหน้าที่ = กรมท่า เป็นทางการ */
        :root[data-mode="user"] {
            --a1:      #667eea;
            --a2:      #764ba2;
            --accent:  #667eea;
            --onbtn:   #ffffff;
            --page:    linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --ring:    rgba(102,126,234,.14);
        }
        :root[data-mode="staff"] {
            --a1:      #1e293b;
            --a2:      #334155;
            --accent:  #c2900f;
            --onbtn:   #ffffff;
            --page:    linear-gradient(135deg, #0f172a 0%, #334155 100%);
            --ring:    rgba(30,41,59,.14);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Sarabun',sans-serif;
            background: var(--page);
            min-height:100vh; min-height:100dvh;
            display:flex; align-items:center; justify-content:center;
            padding:2rem 1rem;
            transition: background .55s ease;
        }

        .card {
            width:100%; max-width:430px;
            background:#fff;
            border-radius:20px;
            padding:2.25rem 2.25rem 2rem;
            box-shadow:0 24px 55px rgba(0,0,0,.22);
            position:relative; overflow:hidden;
        }
        .card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:4px;
            background:linear-gradient(90deg, var(--a1), var(--a2));
            transition: background .55s ease;
        }

        /* ====== สวิตช์สองช่อง ====== */
        .seg {
            position:relative;
            display:grid; grid-template-columns:1fr 1fr;
            background:#eef1f6;
            border-radius:12px;
            padding:4px;
            margin-bottom:1.9rem;
        }
        .seg input { position:absolute; opacity:0; pointer-events:none; }
        .seg label {
            position:relative; z-index:1;
            text-align:center; cursor:pointer;
            padding:.62rem .4rem;
            font-size:.92rem; font-weight:600;
            color:#6b7280;
            border-radius:9px;
            transition:color .3s ease;
            display:flex; align-items:center; justify-content:center; gap:.4rem;
            user-select:none;
        }
        .seg label i { font-size:.85rem; }
        .seg .pill {
            position:absolute; z-index:0;
            top:4px; bottom:4px; left:4px;
            width:calc(50% - 4px);
            background:#fff;
            border-radius:9px;
            box-shadow:0 2px 8px rgba(15,23,42,.13);
            transition:transform .32s cubic-bezier(.4,0,.2,1);
        }
        :root[data-mode="staff"] .seg .pill { transform:translateX(100%); }
        :root[data-mode="user"]  label[for="m-user"]  { color:var(--a1); }
        :root[data-mode="staff"] label[for="m-staff"] { color:var(--a1); }
        .seg input:focus-visible + label { outline:2px solid var(--accent); outline-offset:2px; }

        /* ====== หัวการ์ด ====== */
        .head { text-align:center; margin-bottom:1.75rem; }
        .icon {
            width:62px; height:62px; margin:0 auto 1rem;
            border-radius:50%;
            background:linear-gradient(135deg, var(--a1), var(--a2));
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-size:1.45rem;
            box-shadow:0 8px 20px var(--ring);
            transition:background .55s ease;
        }
        .head h1 {
            font-family:'Prompt',sans-serif;
            font-size:1.45rem; font-weight:600; color:#1f2937; margin-bottom:.3rem;
        }
        .head p { color:#6b7280; font-size:.92rem; }

        /* ข้อความสลับ: ซ่อน/แสดงตามโหมด
           ใช้ :root นำหน้าให้ความจำเพาะสูงกว่ากฎ .notice ที่อยู่ด้านล่าง
           ไม่งั้น display:flex ของ .notice จะชนะ แล้วข้อความจะโผล่ทั้งสองโหมด */
        :root [data-for] { display:none; }

        :root[data-mode="user"]  [data-for="user"],
        :root[data-mode="staff"] [data-for="staff"]        { display:block; }

        :root[data-mode="user"]  .notice[data-for="user"],
        :root[data-mode="staff"] .notice[data-for="staff"] { display:flex; }

        :root[data-mode="user"]  i[data-for="user"],
        :root[data-mode="staff"] i[data-for="staff"]       { display:inline-block; }

        :root[data-mode="user"]  span[data-for="user"],
        :root[data-mode="staff"] span[data-for="staff"]    { display:inline; }

        /* ====== ฟอร์ม ====== */
        label.fl { display:block; font-size:.88rem; font-weight:500; color:#4b5563; margin-bottom:.45rem; }
        .field { position:relative; margin-bottom:1.15rem; }
        .field input {
            width:100%; padding:.82rem 2.6rem .82rem 1rem;
            border:1.5px solid #e2e8f0; border-radius:11px;
            font-family:'Sarabun',sans-serif; font-size:max(16px,.97rem);
            color:#1f2937; transition:border-color .25s ease, box-shadow .25s ease;
        }
        .field input:focus {
            outline:none; border-color:var(--a1);
            box-shadow:0 0 0 3px var(--ring);
        }
        .field > i {
            position:absolute; right:1rem; top:50%; transform:translateY(-50%);
            color:#9ca3af; font-size:.95rem; pointer-events:none;
        }
        .btn {
            width:100%; min-height:48px; margin-top:.45rem;
            background:linear-gradient(135deg, var(--a1), var(--a2));
            color:var(--onbtn); border:none; border-radius:11px;
            font-family:'Prompt',sans-serif; font-size:1rem; font-weight:500;
            cursor:pointer; transition:transform .2s ease, box-shadow .2s ease, background .55s ease;
            display:flex; align-items:center; justify-content:center; gap:.5rem;
        }
        .btn:hover { transform:translateY(-2px); box-shadow:0 10px 24px var(--ring); }

        .notice {
            margin-top:1.3rem; padding-top:1.1rem; border-top:1px solid #eef1f6;
            font-size:.82rem; color:#6b7280; line-height:1.65;
            display:flex; align-items:flex-start; gap:.5rem;
        }
        .notice i { color:var(--accent); margin-top:.18rem; }

        .org { text-align:center; margin-top:1.4rem; color:rgba(255,255,255,.72); font-size:.82rem; }
        .wrap { width:100%; max-width:430px; }

        @media (max-width:420px) { .card { padding:1.9rem 1.4rem 1.6rem; } }
        @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <!-- สวิตช์เลือกประเภทผู้ใช้ -->
        <div class="seg" role="radiogroup" aria-label="เลือกประเภทผู้ใช้">
            <span class="pill" aria-hidden="true"></span>
            <input type="radio" name="mode" id="m-user" value="user" checked>
            <label for="m-user"><i class="fas fa-user"></i> ครู/บุคลากร</label>
            <input type="radio" name="mode" id="m-staff" value="staff">
            <label for="m-staff"><i class="fas fa-user-tie"></i> เจ้าหน้าที่พัสดุ</label>
        </div>

        <div class="head">
            <div class="icon">
                <i class="fas fa-graduation-cap" data-for="user"></i>
                <i class="fas fa-shield-halved" data-for="staff"></i>
            </div>
            <h1 data-for="user">ระบบยืมครุภัณฑ์</h1>
            <h1 data-for="staff">ระบบทะเบียนครุภัณฑ์</h1>
            <p data-for="user">สำหรับครูและบุคลากร</p>
            <p data-for="staff">สำหรับเจ้าหน้าที่พัสดุและหัวหน้าพัสดุ</p>
        </div>

        <form onsubmit="return false;">
            <!-- ส่งโหมดไปกับฟอร์ม เพื่อให้ฝั่งเซิร์ฟเวอร์รู้ว่าเข้ามาทางประตูไหน -->
            <input type="hidden" name="mode" id="modeField" value="user">

            <label class="fl" for="u">ชื่อผู้ใช้</label>
            <div class="field">
                <input id="u" type="text" autocomplete="username">
                <i class="fas fa-user"></i>
            </div>

            <label class="fl" for="p">รหัสผ่าน</label>
            <div class="field">
                <input id="p" type="password" autocomplete="current-password">
                <i class="fas fa-lock"></i>
            </div>

            <button class="btn">
                <span data-for="user">เข้าสู่ระบบ</span>
                <span data-for="staff">เข้าสู่ระบบเจ้าหน้าที่</span>
            </button>
        </form>

        <div class="notice" data-for="staff">
            <i class="fas fa-circle-info"></i>
            <span>ส่วนนี้สำหรับเจ้าหน้าที่พัสดุเท่านั้น การเข้าใช้งานถูกบันทึกไว้ทุกครั้ง</span>
        </div>
        <div class="notice" data-for="user">
            <i class="fas fa-circle-info"></i>
            <span>ใช้บัญชีที่ได้รับจากงานพัสดุ หากเข้าไม่ได้ กรุณาติดต่อเจ้าหน้าที่</span>
        </div>
    </div>

    <p class="org">วิทยาลัยการอาชีพวังไกลกังวล</p>
</div>

<script>
    // สลับธีมทั้งหน้าเมื่อเลือกโหมด
    const root  = document.documentElement;
    const field = document.getElementById('modeField');
    const theme = document.querySelector('meta[name="theme-color"]');
    const bar   = { user: '#667eea', staff: '#0f172a' };

    // เปิดหน้าด้วย ?mode=staff ให้มาที่โหมดเจ้าหน้าที่เลย
    // เผื่อมีลิงก์จากที่อื่นชี้มาตรงโหมดนั้น
    const wanted = new URLSearchParams(location.search).get('mode');
    if (wanted === 'staff' || wanted === 'user') {
        const pick = document.querySelector('.seg input[value="' + wanted + '"]');
        if (pick) {
            pick.checked = true;
            root.dataset.mode = wanted;
            field.value = wanted;
            theme.setAttribute('content', bar[wanted]);
        }
    }

    document.querySelectorAll('.seg input').forEach(radio => {
        radio.addEventListener('change', () => {
            root.dataset.mode = radio.value;
            field.value = radio.value;
            theme.setAttribute('content', bar[radio.value]);
        });
    });
</script>
</body>
</html>
