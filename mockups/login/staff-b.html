<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <title>แบบ B — ประตูเจ้าหน้าที่พัสดุ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/all.min.css">

    <style>
        :root {
            --bg:      #0b1120;
            --card:    #131c30;
            --line:    #24304a;
            --teal:    #2dd4bf;
            --text:    #e2e8f0;
            --muted:   #7e8ba3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg);
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 2rem 1.5rem; position: relative; overflow-x: hidden; overflow-y: auto;
        }
        /* เส้นตารางจาง ๆ ให้ความรู้สึกเป็นห้องควบคุม */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(45,212,191,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45,212,191,.05) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
            -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
        }

        .card {
            position: relative; z-index: 1;
            width: 100%; max-width: 420px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 2.75rem 2.4rem;
            box-shadow: 0 30px 70px rgba(0,0,0,.5);
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 2.4rem; right: 2.4rem; height: 2px;
            background: linear-gradient(90deg, transparent, var(--teal), transparent);
        }

        .badge-row { display: flex; justify-content: center; margin-bottom: 1.5rem; }
        .shield {
            width: 64px; height: 64px; border-radius: 16px;
            background: rgba(45,212,191,.09);
            border: 1px solid rgba(45,212,191,.32);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: var(--teal);
        }

        .head { text-align: center; margin-bottom: 2rem; }
        .head h1 {
            font-family: 'Prompt', sans-serif;
            font-size: 1.4rem; font-weight: 600; color: var(--text); margin-bottom: .45rem;
        }
        .head .tag {
            display: inline-block; font-size: .72rem; letter-spacing: .12em;
            color: var(--teal); background: rgba(45,212,191,.09);
            border: 1px solid rgba(45,212,191,.25);
            padding: .28rem .7rem; border-radius: 999px; margin-bottom: .85rem;
        }
        .head p { color: var(--muted); font-size: .9rem; line-height: 1.6; }

        label { display:block; font-size:.84rem; font-weight:500; color:#9fb0c9; margin-bottom:.45rem; }
        .field { position: relative; margin-bottom: 1.1rem; }
        .field input {
            width: 100%; padding: .82rem 2.6rem .82rem 1rem;
            background: #0d1524; color: var(--text);
            border: 1px solid var(--line); border-radius: 10px;
            font-family: 'Sarabun', sans-serif; font-size: max(16px, .96rem);
            transition: all .2s ease;
        }
        .field input::placeholder { color: #55617a; }
        .field input:focus {
            outline: none; border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(45,212,191,.12);
        }
        .field i {
            position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
            color: #55617a; font-size: .95rem; pointer-events: none;
        }
        .field input:focus + i { color: var(--teal); }

        .btn {
            width: 100%; min-height: 48px; margin-top: .7rem;
            background: var(--teal); color: #06231f;
            border: none; border-radius: 10px;
            font-family: 'Prompt', sans-serif; font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: all .2s ease;
            display: flex; align-items: center; justify-content: center; gap: .5rem;
        }
        .btn:hover { background: #5eead4; transform: translateY(-1px); box-shadow: 0 10px 24px rgba(45,212,191,.22); }

        .switch {
            margin-top: 1.7rem; padding-top: 1.2rem;
            border-top: 1px solid var(--line);
            text-align: center; font-size: .86rem; color: var(--muted);
        }
        .switch a { color: var(--teal); font-weight: 600; text-decoration: none; }
        .switch a:hover { text-decoration: underline; }

        .org {
            position: relative; z-index: 1;
            margin-top: 1.5rem; text-align: center;
            color: #4a5570; font-size: .8rem;
        }
        .wrap { position: relative; z-index: 1; width: 100%; max-width: 420px; }

        @media (max-width: 420px) { .card { padding: 2.25rem 1.6rem; } }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="badge-row">
                <div class="shield"><i class="fas fa-shield-halved"></i></div>
            </div>

            <div class="head">
                <span class="tag">เฉพาะเจ้าหน้าที่พัสดุ</span>
                <h1>ระบบทะเบียนครุภัณฑ์</h1>
                <p>ยืนยันตัวตนเพื่อเข้าจัดการข้อมูล</p>
            </div>

            <form onsubmit="return false;">
                <label for="u">ชื่อผู้ใช้</label>
                <div class="field">
                    <input id="u" type="text" placeholder="ชื่อผู้ใช้เจ้าหน้าที่" autocomplete="username">
                    <i class="fas fa-user-tie"></i>
                </div>

                <label for="p">รหัสผ่าน</label>
                <div class="field">
                    <input id="p" type="password" placeholder="••••••••" autocomplete="current-password">
                    <i class="fas fa-key"></i>
                </div>

                <button class="btn"><i class="fas fa-arrow-right-to-bracket"></i> เข้าสู่ระบบ</button>
            </form>

            <div class="switch">
                ต้องการยืมครุภัณฑ์? <a href="user.html">เข้าสู่ระบบสำหรับผู้ใช้ทั่วไป</a>
            </div>
        </div>
        <p class="org">วิทยาลัยการอาชีพวังไกลกังวล · งานพัสดุ</p>
    </div>
</body>
</html>
